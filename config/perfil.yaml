# O especialista tecnico (etapa "definir modelo") le este arquivo para
# especificar cada compra para o MEU contexto: compatibilidade com o que ja
# tenho, local de uso, habitos. Sem ele, toda compra recomeca do zero e a IA
# recomenda o "melhor do mercado" em vez do certo pra mim.
#
# ATENCAO: este repositorio e PUBLICO. Aqui entra so contexto tecnico nao
# sensivel. Endereco, CPF, pedido e comprovante moram em
# ~/.central-compras/dados-privados/ (regra 4 do CLAUDE.md).
#
# Campo desconhecido fica vazio ou com [VERIFICAR]: a IA pergunta em vez de
# presumir. Cada compra que revelar um dado novo atualiza este arquivo.

