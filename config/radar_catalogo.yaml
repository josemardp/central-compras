    todos: ['agrat{1,2}o', '\bkyn\b', '(12\.?000|\b12k\b)']   # a propria Dufrio escreve "agrato" na URL
    nenhum: ['quente', '\bq\s*[/&]\s*f\b']   # "Q/f" = quente/frio abreviado (achado no conjunto independente, fase 4)

  midea_lite_12k:
